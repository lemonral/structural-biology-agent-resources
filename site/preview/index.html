<script>
(()=>{'use strict';const slides=JSON.parse(document.getElementById('slide-data').textContent),$=id=>document.getElementById(id),image=$('slide'),stage=$('stage'),pages=$('pages');let current=0,touchX=null;
let optionGroup=null,lastGroup='';
slides.forEach((s,i)=>{const label=i<2?'封面与目录':s.chapter;if(label!==lastGroup){optionGroup=document.createElement('optgroup');optionGroup.label=label;pages.appendChild(optionGroup);lastGroup=label}const o=document.createElement('option');o.value=String(i);o.textContent=String(i+1).padStart(2,'0')+'  '+s.title;optionGroup.appendChild(o)});
function fromHash(){const match=location.hash.match(/^#page=(\d+)$/);return match?Number(match[1])-1:0}
function show(index){current=Math.max(0,Math.min(slides.length-1,Number.isFinite(index)?Math.trunc(index):0));const s=slides[current];$('speaker-link').href='../speaker/#page-'+(current+1);$('chapter').textContent=s.chapter||'研究方案';$('error').hidden=true;image.src=s.src;image.alt='第'+(current+1)+'页，'+s.title;pages.value=String(current);const label=(current+1)+' / '+slides.length;$('count').textContent=label;$('fullCount').textContent=label;for(const id of ['prev','fullPrev'])$(id).disabled=current===0;for(const id of ['next','fullNext'])$(id).disabled=current===slides.length-1;$('status').textContent=label+' '+s.title;document.title=(current+1)+'/'+slides.length+' · '+s.title;history.replaceState(null,'','#page='+(current+1));if(slides[current+1]){const p=new Image();p.src=slides[current+1].src}}
for(const id of ['prev','fullPrev'])$(id).addEventListener('click',()=>show(current-1));for(const id of ['next','fullNext'])$(id).addEventListener('click',()=>show(current+1));pages.addEventListener('change',()=>show(Number(pages.value)));window.addEventListener('hashchange',()=>show(fromHash()));image.addEventListener('error',()=>{$('error').hidden=false});$('retry').addEventListener('click',()=>{image.src=slides[current].src+'?retry='+Date.now();$('error').hidden=true});
document.addEventListener('keydown',e=>{if(e.altKey||e.ctrlKey||e.metaKey||['SELECT','INPUT','TEXTAREA'].includes(e.target.tagName))return;let index=null;if(['ArrowRight','ArrowDown','PageDown',' '].includes(e.key))index=current+1;if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key))index=current-1;if(e.key==='Home')index=0;if(e.key==='End')index=slides.length-1;if(index!==null){e.preventDefault();show(index)}});
let controlsTimer=null;const fullControls=stage.querySelector('.full-controls');
function revealControls(){if(document.fullscreenElement!==stage)return;stage.classList.add('controls-visible');clearTimeout(controlsTimer);controlsTimer=setTimeout(()=>{if(fullControls.matches(':focus-within')||fullControls.matches(':hover')){revealControls();return}stage.classList.remove('controls-visible')},2000)}
document.addEventListener('fullscreenchange',()=>{clearTimeout(controlsTimer);if(document.fullscreenElement===stage)revealControls();else stage.classList.remove('controls-visible')});
stage.addEventListener('pointermove',revealControls,{passive:true});stage.addEventListener('pointerdown',revealControls,{passive:true});fullControls.addEventListener('focusin',revealControls);document.addEventListener('keydown',()=>{if(document.fullscreenElement===stage)revealControls()});
if(!stage.requestFullscreen)$('fullscreen').hidden=true;$('fullscreen').addEventListener('click',async()=>{try{await stage.requestFullscreen()}catch{}});$('exitFull').addEventListener('click',()=>document.exitFullscreen());stage.addEventListener('touchstart',e=>{if(e.touches.length===1)touchX=e.touches[0].clientX},{passive:true});stage.addEventListener('touchend',e=>{if(touchX===null)return;const dx=e.changedTouches[0].clientX-touchX;touchX=null;if(Math.abs(dx)>60)show(current+(dx<0?1:-1))},{passive:true});show(fromHash());
})();
</script><script id="chapter-nav">
(()=>{'use strict';
const slides=JSON.parse(document.getElementById('slide-data').textContent),chapters=document.getElementById('chapters'),pages=document.getElementById('pages'),groups=[],seen=new Set();
slides.forEach((s,i)=>{const label=s.chapter||'未分章';if(seen.has(label))return;seen.add(label);groups.push({label,index:i});const o=document.createElement('option');o.value=String(i);o.textContent=label+' · 第'+(i+1)+'页';chapters.appendChild(o)});
function sync(){const page=Number(pages.value);let match=groups[0];for(const group of groups){if(group.index<=page)match=group;else break}if(match)chapters.value=String(match.index)}
chapters.addEventListener('change',()=>{pages.value=chapters.value;pages.dispatchEvent(new Event('change',{bubbles:true}))});
new MutationObserver(sync).observe(document.getElementById('count'),{childList:true,characterData:true,subtree:true});sync();
})();
</script></body></html>
