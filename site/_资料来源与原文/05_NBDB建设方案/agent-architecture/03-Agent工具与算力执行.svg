<svg id="agent-execution-diagram" xmlns="http://www.w3.org/2000/svg" width="1280" height="930" viewBox="0 0 1280 930" role="img" aria-labelledby="agent-execution-diagram-title agent-execution-diagram-desc" font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,Arial,sans-serif"><title id="agent-execution-diagram-title">Agent 到工具、软件环境、调度器与计算资源的关系</title><desc id="agent-execution-diagram-desc">Agent、表单和工作流提交统一 RunSpec；程序解析 Operation 和 Deployment 并校验权限预算，经不同连接器进入固定软件环境或授权服务，再由对应执行后端调度资源，结果回到统一资产与证据系统。</desc><defs><marker id="agent-execution-diagram-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#476e7b"/></marker><marker id="agent-execution-diagram-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0d8b82"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><path d="M 280 55 L 400 55" fill="none" stroke="#476e7b" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#agent-execution-diagram-arrow)"/><path d="M 1000 55 L 880 55" fill="none" stroke="#476e7b" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#agent-execution-diagram-arrow)"/><path d="M 640 90 L 640 145" fill="none" stroke="#476e7b" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#agent-execution-diagram-arrow)"/><path d="M 640 223 L 640 256 L 160 256 L 160 291" fill="none" stroke="#476e7b" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#agent-execution-diagram-arrow)"/><path d="M 160 357 L 160 406" fill="none" stroke="#476e7b" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#agent-execution-diagram-arrow)"/><path d="M 160 511 L 160 565" fill="none" stroke="#476e7b" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#agent-execution-diagram-arrow)"/><path d="M 160 631 L 160 680" fill="none" stroke="#476e7b" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#agent-execution-diagram-arrow)"/><path d="M 160 746 L 160 785 L 640 785" fill="none" stroke="#476e7b" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M 640 223 L 640 256 L 480 256 L 480 291" fill="none" stroke="#476e7b" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#agent-execution-diagram-arrow)"/><path d="M 480 357 L 480 406" fill="none" stroke="#476e7b" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#agent-execution-diagram-arrow)"/><path d="M 480 511 L 480 565" fill="none" stroke="#476e7b" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#agent-execution-diagram-arrow)"/><path d="M 480 631 L 480 680" fill="none" stroke="#476e7b" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#agent-execution-diagram-arrow)"/><path d="M 480 746 L 480 785 L 640 785" fill="none" stroke="#476e7b" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M 640 223 L 640 256 L 800 256 L 800 291" fill="none" stroke="#476e7b" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#agent-execution-diagram-arrow)"/><path d="M 800 357 L 800 406" fill="none" stroke="#476e7b" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#agent-execution-diagram-arrow)"/><path d="M 800 511 L 800 565" fill="none" stroke="#476e7b" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#agent-execution-diagram-arrow)"/><path d="M 800 631 L 800 680" fill="none" stroke="#476e7b" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#agent-execution-diagram-arrow)"/><path d="M 800 746 L 800 785 L 640 785" fill="none" stroke="#476e7b" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M 640 223 L 640 256 L 1120 256 L 1120 291" fill="none" stroke="#476e7b" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#agent-execution-diagram-arrow)"/><path d="M 1120 357 L 1120 406" fill="none" stroke="#476e7b" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#agent-execution-diagram-arrow)"/><path d="M 1120 511 L 1120 565" fill="none" stroke="#476e7b" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#agent-execution-diagram-arrow)"/><path d="M 1120 631 L 1120 680" fill="none" stroke="#476e7b" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#agent-execution-diagram-arrow)"/><path d="M 1120 746 L 1120 785 L 640 785" fill="none" stroke="#476e7b" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M 640 785 L 640 822" fill="none" stroke="#476e7b" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#agent-execution-diagram-arrow)"/><rect x="581.7" y="801" width="116.6" height="22" rx="4" fill="#fff" stroke="none" stroke-width="1.8"/><text x="640" y="815" text-anchor="middle" font-size="15" fill="#53717e" font-weight="400">产物与真实状态回传</text><rect x="30" y="20" width="250" height="70" rx="12" fill="#edf1ff" stroke="#889acb" stroke-width="1.8"/><text x="155.0" y="49.0" text-anchor="middle" font-size="20" fill="#224c59" font-weight="650">Agent 自然语言</text><text x="155.0" y="74.0" text-anchor="middle" font-size="15.5" fill="#587680" font-weight="400">发现能力、选择操作</text><rect x="400" y="20" width="480" height="70" rx="12" fill="#eaf6f1" stroke="#72aa9a" stroke-width="1.8"/><text x="640.0" y="49.0" text-anchor="middle" font-size="20" fill="#224c59" font-weight="650">统一 RunSpec / Workflow DAG</text><text x="640.0" y="74.0" text-anchor="middle" font-size="15.5" fill="#587680" font-weight="400">同一输入、参数、状态、预算与结果契约</text><rect x="1000" y="20" width="250" height="70" rx="12" fill="#eaf6f1" stroke="#72aa9a" stroke-width="1.8"/><text x="1125.0" y="49.0" text-anchor="middle" font-size="20" fill="#224c59" font-weight="650">表单 / 工作流 / API</text><text x="1125.0" y="74.0" text-anchor="middle" font-size="15.5" fill="#587680" font-weight="400">用户可直接运行工具</text><rect x="260" y="145" width="760" height="78" rx="12" fill="#eaf6f1" stroke="#72aa9a" stroke-width="1.8"/><text x="640.0" y="178.0" text-anchor="middle" font-size="20" fill="#224c59" font-weight="650">Operation + Deployment 解析与准入</text><text x="640.0" y="203.0" text-anchor="middle" font-size="15.5" fill="#587680" font-weight="400">环境 / 数据依赖 / 授权许可 / 资源 / 预算 / 验证范围</text><rect x="40" y="291" width="240" height="66" rx="12" fill="#eaf6f1" stroke="#72aa9a" stroke-width="1.8"/><text x="160.0" y="330.0" text-anchor="middle" font-size="20" fill="#224c59" font-weight="650">CLI / Library 连接器</text><rect x="40" y="406" width="240" height="105" rx="12" fill="#fff3e2" stroke="#d1a468" stroke-width="1.8"/><text x="160.0" y="440.5" text-anchor="middle" font-size="20" fill="#224c59" font-weight="650">独立科学软件环境</text><text x="160.0" y="465.5" text-anchor="middle" font-size="15.5" fill="#587680" font-weight="400">Gemmi / Vina 等</text><text x="160.0" y="488.5" text-anchor="middle" font-size="15.5" fill="#587680" font-weight="400">固定程序与参数</text><rect x="40" y="565" width="240" height="66" rx="12" fill="#eaf6f1" stroke="#72aa9a" stroke-width="1.8"/><text x="160.0" y="604.0" text-anchor="middle" font-size="20" fill="#224c59" font-weight="650">本地 / 容器后端</text><rect x="40" y="680" width="240" height="66" rx="12" fill="#f0f4f7" stroke="#9fb2bf" stroke-width="1.8"/><text x="160.0" y="719.0" text-anchor="middle" font-size="20" fill="#224c59" font-weight="650">CPU / GPU</text><rect x="360" y="291" width="240" height="66" rx="12" fill="#eaf6f1" stroke="#72aa9a" stroke-width="1.8"/><text x="480.0" y="330.0" text-anchor="middle" font-size="20" fill="#224c59" font-weight="650">工作流后端连接器</text><rect x="360" y="406" width="240" height="105" rx="12" fill="#fff3e2" stroke="#d1a468" stroke-width="1.8"/><text x="480.0" y="440.5" text-anchor="middle" font-size="20" fill="#224c59" font-weight="650">已接入的专业工作流</text><text x="480.0" y="465.5" text-anchor="middle" font-size="15.5" fill="#587680" font-weight="400">RELION / GROMACS 等</text><text x="480.0" y="488.5" text-anchor="middle" font-size="15.5" fill="#587680" font-weight="400">流程引擎或软件原生作业</text><rect x="360" y="565" width="240" height="66" rx="12" fill="#eaf6f1" stroke="#72aa9a" stroke-width="1.8"/><text x="480.0" y="604.0" text-anchor="middle" font-size="20" fill="#224c59" font-weight="650">Slurm / 集群适配</text><rect x="360" y="680" width="240" height="66" rx="12" fill="#f0f4f7" stroke="#9fb2bf" stroke-width="1.8"/><text x="480.0" y="719.0" text-anchor="middle" font-size="20" fill="#224c59" font-weight="650">多节点 / GPU / MPI</text><rect x="680" y="291" width="240" height="66" rx="12" fill="#eaf6f1" stroke="#72aa9a" stroke-width="1.8"/><text x="800.0" y="330.0" text-anchor="middle" font-size="20" fill="#224c59" font-weight="650">远程服务连接器</text><rect x="680" y="406" width="240" height="105" rx="12" fill="#fff3e2" stroke="#d1a468" stroke-width="1.8"/><text x="800.0" y="440.5" text-anchor="middle" font-size="20" fill="#224c59" font-weight="650">机构授权软件服务</text><text x="800.0" y="465.5" text-anchor="middle" font-size="15.5" fill="#587680" font-weight="400">CryoSPARC 等可用实例</text><text x="800.0" y="488.5" text-anchor="middle" font-size="15.5" fill="#587680" font-weight="400">正式 API / 授权接口</text><rect x="680" y="565" width="240" height="66" rx="12" fill="#eaf6f1" stroke="#72aa9a" stroke-width="1.8"/><text x="800.0" y="604.0" text-anchor="middle" font-size="20" fill="#224c59" font-weight="650">远端作业管理</text><rect x="680" y="680" width="240" height="66" rx="12" fill="#f0f4f7" stroke="#9fb2bf" stroke-width="1.8"/><text x="800.0" y="719.0" text-anchor="middle" font-size="20" fill="#224c59" font-weight="650">机构 / 服务资源池</text><rect x="1000" y="291" width="240" height="66" rx="12" fill="#eaf6f1" stroke="#72aa9a" stroke-width="1.8"/><text x="1120.0" y="330.0" text-anchor="middle" font-size="20" fill="#224c59" font-weight="650">交互会话连接器</text><rect x="1000" y="406" width="240" height="105" rx="12" fill="#fff3e2" stroke="#d1a468" stroke-width="1.8"/><text x="1120.0" y="440.5" text-anchor="middle" font-size="20" fill="#224c59" font-weight="650">Notebook / 图形应用</text><text x="1120.0" y="465.5" text-anchor="middle" font-size="15.5" fill="#587680" font-weight="400">Coot / CCPN / Jupyter</text><text x="1120.0" y="488.5" text-anchor="middle" font-size="15.5" fill="#587680" font-weight="400">人工检查点与研究代码</text><rect x="1000" y="565" width="240" height="66" rx="12" fill="#eaf6f1" stroke="#72aa9a" stroke-width="1.8"/><text x="1120.0" y="604.0" text-anchor="middle" font-size="20" fill="#224c59" font-weight="650">交互会话管理</text><rect x="1000" y="680" width="240" height="66" rx="12" fill="#f0f4f7" stroke="#9fb2bf" stroke-width="1.8"/><text x="1120.0" y="719.0" text-anchor="middle" font-size="20" fill="#224c59" font-weight="650">交互 CPU / GPU</text><rect x="260" y="822" width="760" height="72" rx="12" fill="#eaf6f1" stroke="#72aa9a" stroke-width="1.8"/><text x="640.0" y="852.0" text-anchor="middle" font-size="20" fill="#224c59" font-weight="650">统一产物采集、领域校验、资产与证据登记</text><text x="640.0" y="877.0" text-anchor="middle" font-size="15.5" fill="#587680" font-weight="400">全部状态和成果关联到同一 Run / Project；事件回传 Agent</text><text x="640" y="923" text-anchor="middle" font-size="15" fill="#627d88" font-weight="400">后端负责作业管理，资源层负责实际计算；每个子作业只有一个调度权威。</text></svg>