<svg id="agent-sequence-diagram" xmlns="http://www.w3.org/2000/svg" width="1280" height="1100" viewBox="0 0 1280 1100" role="img" aria-labelledby="agent-sequence-diagram-title agent-sequence-diagram-desc" font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,Arial,sans-serif"><title id="agent-sequence-diagram-title">Agent 多步任务执行时序</title><desc id="agent-sequence-diagram-desc">展示从用户请求到计划、预算校验、异步作业提交、事件唤醒、产物校验、有限重规划与结果交付的顺序；需要专业判断时转入人工检查点。</desc><defs><marker id="agent-sequence-diagram-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#476e7b"/></marker><marker id="agent-sequence-diagram-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0d8b82"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><rect x="625" y="444" width="425" height="178" rx="10" fill="#f1f7f5" stroke="#cbdfd7" stroke-width="1.8"/><rect x="40" y="1000" width="1200" height="70" rx="10" fill="#fff7eb" stroke="#e4ca9e" stroke-width="1.8"/><path d="M 105 84 L 105 1010" fill="none" stroke="#476e7b" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 6"/><path d="M 320 84 L 320 1010" fill="none" stroke="#476e7b" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 6"/><path d="M 530 84 L 530 1010" fill="none" stroke="#476e7b" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 6"/><path d="M 740 84 L 740 1010" fill="none" stroke="#476e7b" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 6"/><path d="M 950 84 L 950 1010" fill="none" stroke="#476e7b" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 6"/><path d="M 1165 84 L 1165 1010" fill="none" stroke="#476e7b" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 6"/><path d="M 105 129 L 320 129" fill="none" stroke="#476e7b" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#agent-sequence-diagram-arrow)"/><rect x="154.2" y="104" width="116.6" height="22" rx="4" fill="#fff" stroke="none" stroke-width="1.8"/><text x="212.5" y="118" text-anchor="middle" font-size="15" fill="#53717e" font-weight="400">目标 + 数据引用</text><path d="M 320 191 L 530 191" fill="none" stroke="#476e7b" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#agent-sequence-diagram-arrow)"/><rect x="361.0" y="166" width="128.0" height="22" rx="4" fill="#fff" stroke="none" stroke-width="1.8"/><text x="425.0" y="180" text-anchor="middle" font-size="15" fill="#53717e" font-weight="400">上下文 + 可用工具</text><path d="M 530 253 L 320 253" fill="none" stroke="#476e7b" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 6" marker-end="url(#agent-sequence-diagram-arrow)"/><rect x="389.5" y="228" width="71.0" height="22" rx="4" fill="#fff" stroke="none" stroke-width="1.8"/><text x="425.0" y="242" text-anchor="middle" font-size="15" fill="#53717e" font-weight="400">结构化计划</text><path d="M 320 283 L 393 283 L 393 328 L 320 328" fill="none" stroke="#476e7b" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#agent-sequence-diagram-arrow)"/><rect x="410" y="284" width="162.2" height="22" rx="4" fill="#fff" stroke="none" stroke-width="1.8"/><text x="414" y="298" text-anchor="start" font-size="15" fill="#53717e" font-weight="400">程序校验 / 原子预留预算</text><path d="M 320 377 L 740 377" fill="none" stroke="#476e7b" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#agent-sequence-diagram-arrow)"/><rect x="403.3" y="352" width="253.4" height="22" rx="4" fill="#fff" stroke="none" stroke-width="1.8"/><text x="530.0" y="366" text-anchor="middle" font-size="15" fill="#53717e" font-weight="400">保存计划与步骤；提交已校验 RunSpec</text><path d="M 320 424 L 105 424" fill="none" stroke="#476e7b" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 6" marker-end="url(#agent-sequence-diagram-arrow)"/><rect x="108.6" y="399" width="207.8" height="22" rx="4" fill="#fff" stroke="none" stroke-width="1.8"/><text x="212.5" y="413" text-anchor="middle" font-size="15" fill="#53717e" font-weight="400">返回 runId / 持续推送状态</text><path d="M 740 505 L 950 505" fill="none" stroke="#476e7b" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#agent-sequence-diagram-arrow)"/><rect x="803.8" y="480" width="82.4" height="22" rx="4" fill="#fff" stroke="none" stroke-width="1.8"/><text x="845.0" y="494" text-anchor="middle" font-size="15" fill="#53717e" font-weight="400">提交真实作业</text><path d="M 950 562 L 740 562" fill="none" stroke="#476e7b" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 6" marker-end="url(#agent-sequence-diagram-arrow)"/><rect x="752.5" y="537" width="185.0" height="22" rx="4" fill="#fff" stroke="none" stroke-width="1.8"/><text x="845.0" y="551" text-anchor="middle" font-size="15" fill="#53717e" font-weight="400">jobId / 排队与运行状态</text><path d="M 950 649 L 740 649" fill="none" stroke="#476e7b" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 6" marker-end="url(#agent-sequence-diagram-arrow)"/><rect x="769.6" y="624" width="150.8" height="22" rx="4" fill="#fff" stroke="none" stroke-width="1.8"/><text x="845.0" y="638" text-anchor="middle" font-size="15" fill="#53717e" font-weight="400">作业事件 / 可收集产物</text><path d="M 740 707 L 1165 707" fill="none" stroke="#476e7b" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#agent-sequence-diagram-arrow)"/><rect x="854.3" y="682" width="196.4" height="22" rx="4" fill="#fff" stroke="none" stroke-width="1.8"/><text x="952.5" y="696" text-anchor="middle" font-size="15" fill="#53717e" font-weight="400">登记产物、解析日志并请求领域校验</text><path d="M 1165 765 L 320 765" fill="none" stroke="#476e7b" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 6" marker-end="url(#agent-sequence-diagram-arrow)"/><rect x="570.2" y="740" width="344.6" height="22" rx="4" fill="#fff" stroke="none" stroke-width="1.8"/><text x="742.5" y="754" text-anchor="middle" font-size="15" fill="#53717e" font-weight="400">Observation：运行状态、指标、校验结果与证据引用</text><path d="M 320 826 L 530 826" fill="none" stroke="#476e7b" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#agent-sequence-diagram-arrow)"/><rect x="343.9" y="801" width="162.2" height="22" rx="4" fill="#fff" stroke="none" stroke-width="1.8"/><text x="425.0" y="815" text-anchor="middle" font-size="15" fill="#53717e" font-weight="400">需要时继续 / 有限重规划</text><path d="M 530 885 L 320 885" fill="none" stroke="#476e7b" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 6" marker-end="url(#agent-sequence-diagram-arrow)"/><rect x="355.3" y="860" width="139.4" height="22" rx="4" fill="#fff" stroke="none" stroke-width="1.8"/><text x="425.0" y="874" text-anchor="middle" font-size="15" fill="#53717e" font-weight="400">下一步或基于证据的说明</text><path d="M 320 950 L 105 950" fill="none" stroke="#476e7b" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 6" marker-end="url(#agent-sequence-diagram-arrow)"/><rect x="142.8" y="925" width="139.4" height="22" rx="4" fill="#fff" stroke="none" stroke-width="1.8"/><text x="212.5" y="939" text-anchor="middle" font-size="15" fill="#53717e" font-weight="400">状态、结构、表格与报告</text><rect x="6" y="20" width="198" height="64" rx="12" fill="#173d4b" stroke="#173d4b" stroke-width="1.8"/><text x="105.0" y="58.0" text-anchor="middle" font-size="20" fill="#f4ffff" font-weight="650">用户 / 工作台</text><rect x="221" y="20" width="198" height="64" rx="12" fill="#173d4b" stroke="#173d4b" stroke-width="1.8"/><text x="320.0" y="58.0" text-anchor="middle" font-size="20" fill="#f4ffff" font-weight="650">Run 控制服务</text><rect x="431" y="20" width="198" height="64" rx="12" fill="#edf1ff" stroke="#889acb" stroke-width="1.8"/><text x="530.0" y="58.0" text-anchor="middle" font-size="20" fill="#224c59" font-weight="650">LLM 网关</text><rect x="641" y="20" width="198" height="64" rx="12" fill="#173d4b" stroke="#173d4b" stroke-width="1.8"/><text x="740.0" y="58.0" text-anchor="middle" font-size="20" fill="#f4ffff" font-weight="650">执行器 / 连接器</text><rect x="851" y="20" width="198" height="64" rx="12" fill="#173d4b" stroke="#173d4b" stroke-width="1.8"/><text x="950.0" y="58.0" text-anchor="middle" font-size="20" fill="#f4ffff" font-weight="650">科学计算后端</text><rect x="1066" y="20" width="198" height="64" rx="12" fill="#173d4b" stroke="#173d4b" stroke-width="1.8"/><text x="1165.0" y="58.0" text-anchor="middle" font-size="20" fill="#f4ffff" font-weight="650">产物与验证</text><text x="837" y="469" text-anchor="middle" font-size="15" fill="#4b7b6a" font-weight="650">异步计算：模型无需持续在线</text><text x="640" y="1027" text-anchor="middle" font-size="17" fill="#8c642e" font-weight="600">人工分支：WAITING_FOR_USER → 平台内交互检查 → 保存产物 → 校验后续跑</text><text x="640" y="1052" text-anchor="middle" font-size="15" fill="#876b44" font-weight="400">失败分支：分类错误并检查剩余预算；允许的错误受限重试，其余保存已完成结果并停止或请求输入。</text></svg>