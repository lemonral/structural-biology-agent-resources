<svg id="agent-core-diagram" xmlns="http://www.w3.org/2000/svg" width="1280" height="900" viewBox="0 0 1280 900" role="img" aria-labelledby="agent-core-diagram-title agent-core-diagram-desc" font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,Arial,sans-serif"><title id="agent-core-diagram-title">NBDB Agent 核心架构与执行闭环</title><desc id="agent-core-diagram-desc">用户目标经上下文构建进入规划模型；程序校验计划、权限与预算，执行器通过连接器调用真实科学软件。产物解析和领域校验产生 Observation，更新持久化状态后继续规划；完成条件满足时生成带证据的报告。</desc><defs><marker id="agent-core-diagram-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#476e7b"/></marker><marker id="agent-core-diagram-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0d8b82"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><rect x="270" y="245" width="740" height="385" rx="18" fill="#f7fafb" stroke="#9bb8c2" stroke-width="1.8" stroke-dasharray="7 6"/><path d="M 640 92 L 640 126" fill="none" stroke="#476e7b" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#agent-core-diagram-arrow)"/><path d="M 240 167 L 500 167" fill="none" stroke="#476e7b" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 6" marker-end="url(#agent-core-diagram-arrow)"/><rect x="319.1" y="142" width="93.8" height="22" rx="4" fill="#fff" stroke="none" stroke-width="1.8"/><text x="366" y="156" text-anchor="middle" font-size="15" fill="#53717e" font-weight="400">摘要与对象引用</text><path d="M 640 208 L 640 233 L 450 233 L 450 300" fill="none" stroke="#476e7b" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#agent-core-diagram-arrow)"/><path d="M 240 334 L 310 334" fill="none" stroke="#476e7b" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 6" marker-end="url(#agent-core-diagram-arrow)"/><path d="M 590 344 L 680 344" fill="none" stroke="#476e7b" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#agent-core-diagram-arrow)"/><rect x="607.2" y="311" width="59.6" height="22" rx="4" fill="#fff" stroke="none" stroke-width="1.8"/><text x="637" y="325" text-anchor="middle" font-size="15" fill="#53717e" font-weight="400">Plan</text><path d="M 1060 334 L 960 334" fill="none" stroke="#476e7b" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 6" marker-end="url(#agent-core-diagram-arrow)"/><path d="M 1060 310 L 1040 310 L 1040 167 L 780 167" fill="none" stroke="#476e7b" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 6" marker-end="url(#agent-core-diagram-arrow)"/><rect x="832.6" y="141" width="150.8" height="22" rx="4" fill="#fff" stroke="none" stroke-width="1.8"/><text x="908" y="155" text-anchor="middle" font-size="15" fill="#53717e" font-weight="400">可用操作与 Schema</text><path d="M 820 388 L 820 470" fill="none" stroke="#476e7b" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#agent-core-diagram-arrow)"/><rect x="810.3" y="419" width="139.4" height="22" rx="4" fill="#fff" stroke="none" stroke-width="1.8"/><text x="880" y="433" text-anchor="middle" font-size="15" fill="#53717e" font-weight="400">已校验 RunSpec</text><path d="M 960 514 L 1060 514" fill="none" stroke="#476e7b" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#agent-core-diagram-arrow)"/><rect x="992.0" y="481" width="40" height="22" rx="4" fill="#fff" stroke="none" stroke-width="1.8"/><text x="1012" y="495" text-anchor="middle" font-size="15" fill="#53717e" font-weight="400">提交</text><path d="M 1060 565 L 1035 565 L 1035 605 L 640 605 L 640 514 L 590 514" fill="none" stroke="#476e7b" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#agent-core-diagram-arrow)"/><rect x="670.8" y="582" width="196.4" height="22" rx="4" fill="#fff" stroke="none" stroke-width="1.8"/><text x="769" y="596" text-anchor="middle" font-size="15" fill="#53717e" font-weight="400">真实运行状态 + 产物 + 日志</text><path d="M 450 470 L 450 388" fill="none" stroke="#0d8b82" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#agent-core-diagram-teal)"/><rect x="307.6" y="421" width="139.4" height="22" rx="4" fill="#fff" stroke="none" stroke-width="1.8"/><text x="443" y="435" text-anchor="end" font-size="15" fill="#087e83" font-weight="400">Observation</text><path d="M 450 558 L 450 730" fill="none" stroke="#476e7b" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#agent-core-diagram-arrow)"/><rect x="357.5" y="676" width="185.0" height="22" rx="4" fill="#fff" stroke="none" stroke-width="1.8"/><text x="450" y="690" text-anchor="middle" font-size="15" fill="#53717e" font-weight="400">必需产物与验证通过，目标已满足</text><path d="M 590 773 L 680 773" fill="none" stroke="#476e7b" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#agent-core-diagram-arrow)"/><rect x="617.0" y="741" width="40" height="22" rx="4" fill="#fff" stroke="none" stroke-width="1.8"/><text x="637" y="755" text-anchor="middle" font-size="15" fill="#53717e" font-weight="400">证据</text><path d="M 310 514 L 260 514 L 260 167 L 240 167" fill="none" stroke="#476e7b" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 6" marker-end="url(#agent-core-diagram-arrow)"/><rect x="170.84" y="433" width="83.16" height="20" rx="4" fill="#fff" stroke="none" stroke-width="1.8"/><text x="250" y="445" text-anchor="end" font-size="13" fill="#53717e" font-weight="400">写入状态与证据</text><text x="292" y="270" text-anchor="start" font-size="16" fill="#416672" font-weight="650">Agent Runtime · 持久化控制循环</text><rect x="500" y="20" width="280" height="72" rx="12" fill="#173d4b" stroke="#173d4b" stroke-width="1.8"/><text x="640.0" y="50.0" text-anchor=